<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <g fill="#ffffff" stroke="#ffffff">
    <!-- sickle blade: a crescent from the tip at the top left, round the right -->
    <path stroke="none" d="M8.1 3.1 A8.5 8.5 0 1 1 11.5 18.4 L12 15.6 A6.3 6.3 0 1 0 8.1 3.1 Z"/>
    <!-- sickle handle -->
    <path fill="none" stroke-width="2.6" stroke-linecap="round" d="M11.2 17.6 L6.4 21"/>
    <!-- hammer handle -->
    <path fill="none" stroke-width="2.3" stroke-linecap="round" d="M8 8 L19 19"/>
    <!-- hammer head -->
    <path fill="none" stroke-width="3.4" d="M3.6 9.6 L9.6 3.6"/>
  </g>
</svg>
